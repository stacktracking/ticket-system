<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed - TicketSystem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow">
  <div class="container">
    <a class="navbar-brand" href="index.html">TicketSystem</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="bus.html">Bus</a></li>
        <li class="nav-item"><a class="nav-link" href="train.html">Train</a></li>
        <li class="nav-item"><a class="nav-link" href="plane.html">Plane</a></li>
      </ul>
      <div class="d-flex" id="guest-nav">
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <a href="signup.html" class="btn btn-light">Signup</a>
      </div>
      <div class="d-flex d-none" id="user-nav">
        <a href="profile.html" class="btn btn-outline-light me-2">My Profile</a>
        <button onclick="logout()" class="btn btn-light">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="container">
  <div class="card confirm-card shadow p-4">
    <div class="mb-3" style="font-size: 3rem;">✅</div>
    <h2 class="mb-3">Booking Confirmed!</h2>
    <div id="bookingDetails" class="text-start mx-auto" style="max-width: 320px;"></div>
    <a href="profile.html" class="btn btn-primary mt-4">View My Bookings</a>
    <a href="index.html" class="btn btn-outline-secondary mt-2">Back to Home</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const raw = localStorage.getItem('lastBooking');
  const box = document.getElementById('bookingDetails');

  if (!raw) {
    box.innerHTML = '<p class="text-muted text-center">No recent booking found.</p>';
    return;
  }

  const b = JSON.parse(raw);
  const fromTo = b.route ? `${b.route.from || ''} → ${b.route.to || ''}` : '';

  box.innerHTML = `
    <p><strong>Transport:</strong> ${b.transportType}</p>
    <p><strong>Route:</strong> ${fromTo}</p>
    <p><strong>Date:</strong> ${b.date || 'N/A'}</p>
    <p><strong>Seats:</strong> ${b.seats.join(', ')}</p>
    <p><strong>Total Paid:</strong> ৳${b.totalPrice}</p>
  `;
});
</script>
</body>
</html>
