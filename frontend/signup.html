<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - TicketSystem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow">
  <div class="container">
    <a class="navbar-brand" href="index.html">TicketSystem</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="bus.html">Bus</a></li>
        <li class="nav-item"><a class="nav-link" href="train.html">Train</a></li>
        <li class="nav-item"><a class="nav-link" href="plane.html">Plane</a></li>
      </ul>
      <div class="d-flex" id="guest-nav">
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <a href="signup.html" class="btn btn-light">Signup</a>
      </div>
      <div class="d-flex d-none" id="user-nav">
        <a href="profile.html" class="btn btn-outline-light me-2">My Profile</a>
        <button onclick="logout()" class="btn btn-light">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 460px;">
    <h3>Create Account</h3>
    <form id="signupForm">
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="firstName" class="form-label">First Name</label>
          <input type="text" class="form-control" id="firstName" placeholder="First name" required>
        </div>
        <div class="col-md-6">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" class="form-control" id="lastName" placeholder="Last name" required>
        </div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Create a password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign Up</button>
      <div id="signupError" class="text-danger small mt-2"></div>
    </form>
    <div class="text-center mt-3">
      <small>Already have an account? <a href="login.html">Login</a></small>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', async function (e) {
  e.preventDefault();

  const name = `${document.getElementById('firstName').value} ${document.getElementById('lastName').value}`.trim();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('signupError');
  errorBox.textContent = '';

  try {
    const res = await fetch(`${API_BASE}/auth/signup`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();

    if (res.status === 201) {
      alert(data.message);
      window.location.href = 'login.html';
    } else {
      errorBox.textContent = data.error || 'Signup failed';
    }
  } catch (err) {
    console.error('Signup error:', err);
    errorBox.textContent = 'Could not reach the server. Is the backend running?';
  }
});
</script>
</body>
</html>
