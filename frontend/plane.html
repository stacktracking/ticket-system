<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plane Booking - TicketSystem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.hero-plane{height:280px;position:relative;background:linear-gradient(135deg,#4e73df,#1cc88a);border-radius:0 0 20px 20px;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;margin-bottom:2rem}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow">
  <div class="container">
    <a class="navbar-brand" href="index.html">TicketSystem</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="bus.html">Bus</a></li>
        <li class="nav-item"><a class="nav-link" href="train.html">Train</a></li>
        <li class="nav-item"><a class="nav-link active" href="plane.html">Plane</a></li>
      </ul>
      <div class="d-flex" id="guest-nav">
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <a href="signup.html" class="btn btn-light">Signup</a>
      </div>
      <div class="d-flex d-none" id="user-nav">
        <a href="profile.html" class="btn btn-outline-light me-2">My Profile</a>
        <button onclick="logout()" class="btn btn-light">Logout</button>
      </div>
    </div>
  </div>
</nav>

<section class="hero-plane">
  <div>
    <h3 class="fw-bold">Book Domestic Flights in Bangladesh</h3>
    <button class="btn btn-warning mt-2" id="openBooking">Book Your Flight</button>
  </div>
</section>

<div class="container" id="bookingSection" style="display:none">
  <div class="card p-3 mb-3">
    <div class="row g-2">
      <div class="col-md-4"><label>From</label><select id="from" class="form-select"></select></div>
      <div class="col-md-4"><label>To</label><select id="to" class="form-select"></select></div>
      <div class="col-md-4"><label>Date</label><input type="date" id="date" class="form-control"></div>
    </div>
    <button class="btn btn-primary mt-3" onclick="searchFlights()">Search Flights</button>
  </div>

  <div id="flightList"></div>
  <div id="seatSection" class="mt-4"></div>
  <div id="action" class="mt-3"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
const cities = ["Dhaka", "Chattogram", "Sylhet", "Rajshahi", "Cox's Bazar", "Barishal"];
const flights = [
  { air: "Biman Bangladesh", time: "07:00 - 08:00", price: 4200 },
  { air: "US-Bangla", time: "10:00 - 11:00", price: 3900 },
  { air: "NovoAir", time: "16:00 - 17:00", price: 4100 }
];
let selectedSeats = [], selectedFlight = null;

openBooking.onclick = () => { bookingSection.style.display = 'block'; bookingSection.scrollIntoView({ behavior: 'smooth' }); };
cities.forEach(c => { from.innerHTML += `<option>${c}</option>`; to.innerHTML += `<option>${c}</option>`; });

function searchFlights() {
  if (!from.value || !to.value || from.value === to.value) return alert('Please choose two different cities');
  if (!date.value) return alert('Please select a date');

  flightList.innerHTML = '<h5>Available Flights</h5>';
  flights.forEach((f, i) => {
    flightList.innerHTML += `<div class="card p-2 mb-2 flight-card" onclick="selectFlight(${i})"><b>${f.air}</b><br>${f.time}<br>৳${f.price}</div>`;
  });
  seatSection.innerHTML = "";
  action.innerHTML = "";
}

function selectFlight(i) {
  selectedFlight = i; selectedSeats = [];
  flightList.innerHTML = `<div class="card p-2"><b>${flights[i].air}</b><br>${flights[i].time}<br>৳${flights[i].price}</div>`;
  seatSection.innerHTML = '<h5>Select Seats (Max 4)</h5>';
  let h = '';
  for (let r = 1; r <= 7; r++) {
    h += '<div class="d-flex">';
    for (let c = 1; c <= 3; c++) h += `<div class="seat" onclick="toggleSeat(this)">${r}${String.fromCharCode(64 + c)}</div>`;
    h += '<div class="aisle"></div>';
    for (let c = 4; c <= 6; c++) h += `<div class="seat" onclick="toggleSeat(this)">${r}${String.fromCharCode(64 + c)}</div>`;
    h += '</div>';
  }
  seatSection.innerHTML += h;
  action.innerHTML = '<button class="btn btn-success" onclick="proceedPayment()">Proceed to Payment</button>';
}

function toggleSeat(el) {
  if (el.classList.contains('selected')) {
    el.classList.remove('selected');
    selectedSeats = selectedSeats.filter(s => s != el.innerText);
  } else {
    if (selectedSeats.length >= 4) return alert('Max 4 tickets allowed');
    el.classList.add('selected');
    selectedSeats.push(el.innerText);
  }
}

function proceedPayment() {
  if (!selectedSeats.length) return alert('Select at least one seat');

  const flight = flights[selectedFlight];
  const data = {
    transportType: 'Plane',
    route: { from: from.value, to: to.value },
    date: date.value,
    seats: selectedSeats,
    totalPrice: flight.price * selectedSeats.length
  };

  window.bookTicket(data);
}
</script>
</body>
</html>
