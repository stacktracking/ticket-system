<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow">
  <div class="container">
    <a class="navbar-brand" href="index.html">TicketSystem</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="bus.html">Bus</a></li>
        <li class="nav-item"><a class="nav-link" href="train.html">Train</a></li>
        <li class="nav-item"><a class="nav-link" href="plane.html">Plane</a></li>
      </ul>
      <div class="d-flex" id="guest-nav">
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <a href="signup.html" class="btn btn-light">Signup</a>
      </div>
      <div class="d-flex d-none" id="user-nav">
        <a href="profile.html" class="btn btn-outline-light me-2">My Profile</a>
        <button onclick="logout()" class="btn btn-light">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="container my-5">
  <h3>Bus Ticket Booking</h3>

  <div class="card p-3">
    <div class="row g-2">
      <div class="col-md-4">
        <label>From</label>
        <select id="from" class="form-select"></select>
      </div>
      <div class="col-md-4">
        <label>To</label>
        <select id="to" class="form-select"></select>
      </div>
      <div class="col-md-4">
        <label>Date</label>
        <input type="date" id="travelDate" class="form-control">
      </div>
    </div>
    <button class="btn btn-primary mt-3" onclick="searchBus()">Search Bus</button>
  </div>

  <div id="busList" class="mt-4"></div>
  <div id="seatSection" class="mt-4"></div>
  <div id="bookingAction" class="mt-3"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
const districts = ["Dhaka", "Chattogram", "Rajshahi", "Khulna", "Barishal", "Sylhet", "Rangpur", "Mymensingh"];

const buses = [
  { name: "Green Line", type: "AC", depart: "08:00", arrive: "12:00", price: 600 },
  { name: "Shyamoli", type: "AC", depart: "09:00", arrive: "13:00", price: 650 },
  { name: "Hanif", type: "AC", depart: "10:00", arrive: "14:00", price: 700 },
  { name: "Shohagh", type: "NonAC", depart: "13:00", arrive: "18:00", price: 400 }
];

let selected = [], selectedBusIndex = null;

districts.forEach(d => {
  from.innerHTML += `<option>${d}</option>`;
  to.innerHTML += `<option>${d}</option>`;
});

function searchBus() {
  if (!from.value || !to.value || from.value === to.value) {
    alert("Please choose two different districts");
    return;
  }
  if (!travelDate.value) {
    alert("Please select a travel date");
    return;
  }

  busList.innerHTML = "<h5>Available Buses</h5>";
  buses.forEach((b, i) => {
    busList.innerHTML += `
      <div class="card p-2 mb-2 bus-card" onclick="selectBus(${i})">
        <b>${b.name}</b> (${b.type})<br>
        ${b.depart} → ${b.arrive}<br>
        <b>Price:</b> ৳${b.price}
      </div>`;
  });
  seatSection.innerHTML = "";
  bookingAction.innerHTML = "";
}

function selectBus(i) {
  selectedBusIndex = i;
  selected = [];
  seatSection.innerHTML = "<h5>Select Seats (Max 3)</h5>";
  let html = '';
  for (let r = 1; r <= 6; r++) {
    html += `<div class="d-flex mb-2">
      <div class="seat ${buses[i].type}" onclick="toggle(this)">S${r}1</div>
      <div class="seat ${buses[i].type}" onclick="toggle(this)">S${r}2</div>
      <div class="aisle"></div>
      <div class="seat ${buses[i].type}" onclick="toggle(this)">S${r}3</div>
      <div class="seat ${buses[i].type}" onclick="toggle(this)">S${r}4</div>
    </div>`;
  }
  seatSection.innerHTML += html;
  bookingAction.innerHTML = `<button class="btn btn-success" onclick="proceedBooking()">Proceed</button>`;
}

function toggle(el) {
  if (el.classList.contains("selected")) {
    el.classList.remove("selected");
    selected = selected.filter(s => s !== el.innerText);
  } else {
    if (selected.length >= 3) { alert("Max 3 seats"); return; }
    el.classList.add("selected");
    selected.push(el.innerText);
  }
}

function proceedBooking() {
  if (selected.length === 0) { alert("Select at least one seat"); return; }

  const bus = buses[selectedBusIndex];
  const data = {
    transportType: 'Bus',
    route: { from: from.value, to: to.value },
    date: travelDate.value,
    seats: selected,
    totalPrice: bus.price * selected.length
  };

  window.bookTicket(data);
}
</script>
</body>
</html>
