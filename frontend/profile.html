<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - TicketSystem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow">
  <div class="container">
    <a class="navbar-brand" href="index.html">TicketSystem</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="bus.html">Bus</a></li>
        <li class="nav-item"><a class="nav-link" href="train.html">Train</a></li>
        <li class="nav-item"><a class="nav-link" href="plane.html">Plane</a></li>
      </ul>
      <div class="d-flex" id="guest-nav">
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <a href="signup.html" class="btn btn-light">Signup</a>
      </div>
      <div class="d-flex d-none" id="user-nav">
        <a href="profile.html" class="btn btn-outline-light me-2 active">My Profile</a>
        <button onclick="logout()" class="btn btn-light">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="profile-header">
  <div class="container">
    <h1 class="display-5 fw-bold">My Profile</h1>
    <p class="lead mb-0" id="userName">Loading...</p>
    <p class="opacity-75" id="userEmail">...</p>
  </div>
</div>

<div class="container pb-5">
  <h3 class="mb-4 border-bottom pb-2">Booking History</h3>
  <div id="bookingList" class="row g-4">
    <div class="col-12 text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
